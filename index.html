<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height" />
    <title>F1 PAPER CIRCUIT</title>
    <link data-privacy-font-href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Titillium Web', sans-serif;
        overscroll-behavior: none; /* Prevent bounce effect on mobile */
      }
      .font-display {
        font-family: 'Titillium Web', sans-serif;
        letter-spacing: -0.02em;
      }
      /* Graph paper background pattern with CSS Variables for Theme Support */
      :root {
        --graph-bg: #ffffff;
        --graph-lines: #e5e7eb;
      }
      .dark {
        --graph-bg: #15151e; /* Darker F1 style background */
        --graph-lines: #2a2a35; 
      }
      
      .bg-graph-paper {
        background-color: var(--graph-bg);
        background-image: 
          linear-gradient(to right, var(--graph-lines) 1px, transparent 1px),
          linear-gradient(to bottom, var(--graph-lines) 1px, transparent 1px);
        background-size: 20px 20px;
        transition: background-color 0.3s ease;
      }

      /* GLOBAL SCROLLBAR HIDING */
      ::-webkit-scrollbar {
        display: none;
        width: 0px;
        background: transparent;
      }
      
      html, body {
        scrollbar-width: none;
        -ms-overflow-style: none;
        overflow: hidden;
        height: 100%;
        width: 100%;
        position: fixed; /* Prevent scrolling of body */
      }
      
      .overflow-y-auto {
        scrollbar-width: none;
        -ms-overflow-style: none;
        -webkit-overflow-scrolling: touch;
      }
      .overflow-y-auto::-webkit-scrollbar {
        display: none;
      }
    </style>
